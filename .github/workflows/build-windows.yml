# Compila el instalador de Windows (KitchenSuppressionCalculator_Setup.exe) en una
# máquina Windows de GitHub. Ver packaging/windows/instalador_windows.md,
# "Opción B".
name: Compilar instalador de Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Pruebas del motor de cálculo (ANSUL + Buckeye)
        run: python -m tests

      - name: Compilar con PyInstaller
        run: python -m PyInstaller --noconfirm packaging/windows/KitchenSuppressionCalculator.spec

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Crear instalador
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: KitchenSuppressionCalculator_Setup
          path: packaging/windows/output/KitchenSuppressionCalculator_Setup.exe
