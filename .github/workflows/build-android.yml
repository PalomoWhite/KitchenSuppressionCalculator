name: Compilar APK de Android

# Se ejecuta manualmente desde la pestaña "Actions" de GitHub (botón "Run
# workflow"), o automáticamente al subir una etiqueta de versión (v1.0.0,
# v1.0.1, etc.). No requiere una PC con Linux propia: GitHub compila el
# .apk en una máquina de Ubuntu en la nube (Buildozer solo compila para
# Android en Linux) y deja el resultado como "artifact" descargable.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar ansul/ dentro de android/ansul
        run: |
          rm -rf android/ansul
          cp -r ansul android/ansul

      - name: Compilar APK con Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: android
          buildozer_version: stable

      - name: Subir el APK como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: AnsulFlowCalculator-apk
          path: android/bin/*.apk
