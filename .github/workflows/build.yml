# Compila Kitchen Suppression Calculator para Windows, macOS y Linux en las
# máquinas de GitHub (gratis en repositorios públicos).
#
# Cuándo corre:
#   - Al subir una etiqueta de versión (git push origin v1.3.1): compila los 3
#     y publica un "Release" en GitHub con los 3 archivos para descargar.
#   - A mano: pestaña Actions -> "Compilar Windows, macOS y Linux" -> Run
#     workflow. Compila los 3 y los deja como "artifacts" de esa corrida (no
#     crea Release).
#
# Antes de compilar, cada máquina corre todas las pruebas (python -m tests):
# si alguna falla, no se publica nada.
name: Compilar Windows, macOS y Linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    name: Windows (instalador .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Pruebas (ANSUL + Buckeye + idioma)
        run: python -m tests

      - name: Compilar con PyInstaller
        run: python -m PyInstaller --noconfirm packaging/windows/KitchenSuppressionCalculator.spec

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Crear instalador
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss'

      - name: Nombre final del archivo
        shell: bash
        run: |
          mkdir -p out
          cp packaging/windows/output/KitchenSuppressionCalculator_Setup.exe out/KitchenSuppressionCalculator_Windows_Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  macos:
    name: macOS (Apple Silicon, .dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Pruebas (ANSUL + Buckeye + idioma)
        run: python -m tests

      - name: Compilar con PyInstaller
        run: python -m PyInstaller --noconfirm packaging/multiplataforma/KitchenSuppressionCalculator.spec

      - name: Crear .dmg
        run: |
          mkdir -p out dmg
          cp -R dist/KitchenSuppressionCalculator.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Kitchen Suppression Calculator" -srcfolder dmg \
            -ov -format UDZO out/KitchenSuppressionCalculator_macOS_AppleSilicon.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*

  linux:
    name: Linux (x64, .tar.gz)
    runs-on: ubuntu-22.04   # versión algo antigua de glibc: funciona en más distribuciones
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Pruebas (ANSUL + Buckeye + idioma)
        run: python -m tests

      - name: Compilar con PyInstaller
        run: python -m PyInstaller --noconfirm packaging/multiplataforma/KitchenSuppressionCalculator.spec

      - name: Empaquetar .tar.gz
        run: |
          mkdir -p out
          tar -czf out/KitchenSuppressionCalculator_Linux_x64.tar.gz -C dist KitchenSuppressionCalculator

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Crear el Release con los 3 archivos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kitchen Suppression Calculator $GITHUB_REF_NAME" \
            --notes "Descargas / Downloads:
          - Windows: KitchenSuppressionCalculator_Windows_Setup.exe
          - macOS (Apple Silicon M1/M2/M3/M4): KitchenSuppressionCalculator_macOS_AppleSilicon.dmg
          - Linux x64: KitchenSuppressionCalculator_Linux_x64.tar.gz

          Ayuda de diseño preliminar; ver el aviso en el README.
          Preliminary design aid; see the notice in the README."
